name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Tests use synthetic data (leakage perturbation test, metrics, online learning);
      # the test that needs downloaded data skips itself when it is absent.
      - run: python -m pytest -q

name: weekly-refresh
# Every Monday: download the latest results and calendars, refit the model, replay the seasons,
# rebuild site/data.js and republish the website.  The paper (reports/*.pdf) is NOT regenerated.
# Run it by hand from the Actions tab with "Run workflow".
# Needs: Settings -> Pages -> Source: "GitHub Actions", and Settings -> Actions -> General ->
# Workflow permissions: "Read and write" (the job commits the refreshed site/ files to main).
# Scheduled workflows only run from the default branch, so this file must be on main.
on:
  schedule:
    - cron: "23 6 * * 1"   # Monday 06:23 UTC, after the weekend's last matches
  workflow_dispatch:
concurrency:
  group: weekly-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Past seasons and calendars are reused when a source is briefly unreachable (the code falls back to the
      # cache). The Transfermarkt zip (~240 MB) is deliberately not cached: squad values are re-downloaded each week.
      - uses: actions/cache@v4
        with:
          path: |
            data/raw/football_data
            data/raw/calendar
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - run: make weekly
      - id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.js site/ol-lab-standalone.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Weekly refresh: results through $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
